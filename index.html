<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ساعة تناظرية احترافية</title>
    <style>
        /* إعدادات الخلفية والتصميم العام */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(45deg, #0f0c29, #302b63, #24243e);
        }

        /* حاوية الساعة */
        .clock {
            position: relative;
            width: 350px;
            height: 350px;
            display: flex;
            justify-content: center;
            align-items: center;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 50%;
            border: 2px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 25px 50px rgba(0,0,0,0.5),
                        inset 0 5px 15px rgba(255,255,255,0.1);
            backdrop-filter: blur(10px);
        }

        /* النقطة المركزية */
        .clock::before {
            content: '';
            position: absolute;
            width: 15px;
            height: 15px;
            background: #fff;
            border-radius: 50%;
            z-index: 1000;
        }

        /* تصميم الأرقام */
        .clock span {
            position: absolute;
            inset: 20px;
            text-align: center;
            color: #fff;
            font-size: 1.5em;
            font-weight: bold;
            transform: rotate(calc(30deg * var(--i)));
        }

        .clock span b {
            display: inline-block;
            transform: rotate(calc(-30deg * var(--i)));
        }

        /* إعدادات العقارب */
        .hand {
            position: absolute;
            display: flex;
            justify-content: center;
            border-radius: 50%;
        }

        .hand i {
            position: absolute;
            background: var(--clr);
            border-radius: 6px;
        }

        /* عقرب الساعات */
        .hour {
            width: 160px;
            height: 160px;
            --clr: #ff2972;
        }

        .hour i {
            width: 8px;
            height: 80px;
            top: 20px;
        }

        /* عقرب الدقائق */
        .min {
            width: 230px;
            height: 230px;
            --clr: #fee800;
        }

        .min i {
            width: 4px;
            height: 120px;
            top: 10px;
        }

        /* عقرب الثواني */
        .sec {
            width: 280px;
            height: 280px;
            --clr: #04fc43;
        }

        .sec i {
            width: 2px;
            height: 160px;
            top: -10px;
        }
    </style>
</head>
<body>

    <div class="clock">
        <span style="--i:1;"><b>1</b></span>
        <span style="--i:2;"><b>2</b></span>
        <span style="--i:3;"><b>3</b></span>
        <span style="--i:4;"><b>4</b></span>
        <span style="--i:5;"><b>5</b></span>
        <span style="--i:6;"><b>6</b></span>
        <span style="--i:7;"><b>7</b></span>
        <span style="--i:8;"><b>8</b></span>
        <span style="--i:9;"><b>9</b></span>
        <span style="--i:10;"><b>10</b></span>
        <span style="--i:11;"><b>11</b></span>
        <span style="--i:12;"><b>12</b></span>

        <div class="hand hour" id="hr"><i></i></div>
        <div class="hand min" id="mn"><i></i></div>
        <div class="hand sec" id="sc"><i></i></div>
    </div>

    <script>
        const hr = document.querySelector('#hr');
        const mn = document.querySelector('#mn');
        const sc = document.querySelector('#sc');

        function displayTime() {
            let date = new Date();

            // الحصول على الساعات والدقائق والثواني
            let hh = date.getHours();
            let mm = date.getMinutes();
            let ss = date.getSeconds();

            // حساب الزوايا
            // الساعة 360 درجة، مقسمة على 12 ساعة = 30 درجة لكل ساعة
            // الدقيقة 360 درجة، مقسمة على 60 دقيقة = 6 درجات لكل دقيقة
            let hRotation = 30 * hh + mm / 2;
            let mRotation = 6 * mm;
            let sRotation = 6 * ss;

            hr.style.transform = `rotate(${hRotation}deg)`;
            mn.style.transform = `rotate(${mRotation}deg)`;
            sc.style.transform = `rotate(${sRotation}deg)`;
        }

        // تحديث الساعة كل ثانية
        setInterval(displayTime, 1000);

        // تشغيل الدالة فور تحميل الصفحة لتجنب القفزة الأولى
        displayTime();
    </script>
</body>
</html>
